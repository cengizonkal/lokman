name: Mobil sürüm

# pubspec.yaml'daki sürüm (ör. 0.1.0+1 → v0.1.0) için henüz etiket yoksa
# imzalı APK derler ve GitHub Releases'te yayınlar. Etiketi de bu iş akışı
# oluşturur; yeni sürüm için pubspec.yaml'daki sürümü artırmak yeterlidir.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - name: Sürümü oku
        id: version
        run: |
          full=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          name=${full%%+*}
          tag="v$name"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag zaten yayınlanmış; yeni sürüm için pubspec.yaml'daki sürümü artırın."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          case "$name" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - uses: actions/setup-java@v5
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.version.outputs.exists == 'false'
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Testler
        if: steps.version.outputs.exists == 'false'
        run: |
          flutter pub get
          flutter test

      - name: İmza anahtarı
        id: signing
        if: steps.version.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret'ı yok; APK test (debug) anahtarıyla imzalanacak."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK derle
        if: steps.version.outputs.exists == 'false'
        run: |
          flutter build apk --release
          out="build/lokman-${{ steps.version.outputs.name }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$out"
          (cd build && sha256sum "lokman-${{ steps.version.outputs.name }}.apk" > "lokman-${{ steps.version.outputs.name }}.apk.sha256")
          rm -f android/key.properties android/upload-keystore.jks

      - name: Sürüm notları
        if: steps.version.outputs.exists == 'false'
        run: |
          name="${{ steps.version.outputs.name }}"
          awk -v v="$name" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > build/notes.md
          {
            echo
            echo "### Kurulum"
            echo
            echo "1. Bu sayfadaki \`lokman-$name.apk\` dosyasını telefonunuza indirin."
            echo "2. Dosyayı açın. Telefon izin isterse **Bu kaynaktan yüklemeye izin ver** seçeneğini açın."
            echo "3. **Yükle**'ye dokunun. Uygulama Android 7.0 ve üzerinde çalışır."
          } >> build/notes.md
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            {
              echo
              echo "> **Not:** Bu sürüm test anahtarıyla imzalandı. Kalıcı imza anahtarı eklendiğinde"
              echo "> sonraki sürümü kurmak için uygulamanın kaldırılması gerekebilir; önce"
              echo "> **Paylaş → Paylaş / yedekle** ile verilerinizi yedekleyin."
            } >> build/notes.md
          fi
          cat build/notes.md

      - name: GitHub sürümü yayınla
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lokman ${{ steps.version.outputs.name }}
          body_path: mobile/build/notes.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            mobile/build/lokman-${{ steps.version.outputs.name }}.apk
            mobile/build/lokman-${{ steps.version.outputs.name }}.apk.sha256
