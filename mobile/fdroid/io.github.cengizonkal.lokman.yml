AuthorName: Cengiz Onkal
SourceCode: https://github.com/cengizonkal/lokman
IssueTracker: https://github.com/cengizonkal/lokman/issues
Changelog: https://github.com/cengizonkal/lokman/releases

AutoName: Lokman

RepoType: git
Repo: https://github.com/cengizonkal/lokman.git

Builds:
  - versionName: 0.1.4
    versionCode: 1005
    commit: v0.1.4
    subdir: mobile
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.47.7
    ndk: r28c
    prebuild:
      - echo "flutter.sdk=$$flutter$$" > android/local.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - mobile/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: 0.1.4
    versionCode: 2005
    commit: v0.1.4
    subdir: mobile
